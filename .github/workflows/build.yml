name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pywebview pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --name "RHM_Prenomina" --add-data "index.html;." --add-data "styles.css;." --add-data "app.js;." --add-data "data_seed.js;." --add-data "schema.json;." --add-data "Nomina_Plantilla.xlsx;." main.py

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: RHM_Prenomina_Windows
        path: dist/RHM_Prenomina.exe
